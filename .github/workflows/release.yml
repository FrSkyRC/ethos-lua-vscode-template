name: Release

# Push a tag to publish installable zips (one per language) as a GitHub release:
#   release/1.2.0        -> Release
#   release/1.2.0-rc1    -> Release Candidate (pre-release)
#   snapshot/1.2.0-dev3  -> Snapshot (pre-release)
# Release notes come from the "# <version>" section of Releases.md.

on:
  push:
    tags:
      - 'release/*'
      - 'snapshot/*'

permissions:
  contents: write

jobs:
  langs:
    name: Find languages
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.langs.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: langs
        shell: bash
        run: |
          LIST=$(ls i18n/*.json 2>/dev/null | xargs -n1 basename | sed 's/\.json$//' | jq -R . | jq -sc .)
          [ "$LIST" = "[]" ] || [ -z "$LIST" ] && LIST='["en"]'
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "languages: $LIST"

  build-zips:
    name: Build zip (${{ matrix.lang }})
    needs: langs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(needs.langs.outputs.list) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#release/}"; VER="${VER#snapshot/}"
          echo "GIT_VER=$VER" >> "$GITHUB_ENV"

      - name: Release notes from Releases.md
        run: |
          python .github/scripts/extract-release-notes.py "${{ env.GIT_VER }}" Releases.md > Notes.md
          sed -n '1,60p' Notes.md

      - name: Build package
        run: |
          python bin/package/build_package.py --lang '${{ matrix.lang }}' \
            --artifact-version '${{ env.GIT_VER }}' --release-notes-file Notes.md --output-dir dist

      - name: Validate ethos_lua_manifest.json
        run: |
          for z in dist/*.zip; do python bin/package/validate_ethos_manifest_zip.py "$z"; done

      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.lang }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build-zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release type from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#release/}"; VER="${VER#snapshot/}"
          FLAGS=""
          if [[ "$TAG" == snapshot/* ]]; then TYPE="Snapshot"; FLAGS="--prerelease"
          elif [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+-.+$ ]]; then TYPE="Release Candidate"; FLAGS="--prerelease"
          else TYPE="Release"; fi
          echo "GIT_VER=$VER" >> "$GITHUB_ENV"
          echo "GH_TYPE=$TYPE" >> "$GITHUB_ENV"
          echo "GH_FLAGS=$FLAGS" >> "$GITHUB_ENV"
          echo "PROJECT=$(python -c 'import json;print(json.load(open(".vscode/deploy.json"))["tgt_name"])')" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        run: python .github/scripts/extract-release-notes.py "${{ env.GIT_VER }}" Releases.md > Notes.md

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "${{ env.PROJECT }} ${{ env.GIT_VER }} (${{ env.GH_TYPE }})" \
            --notes-file Notes.md ${{ env.GH_FLAGS }}
